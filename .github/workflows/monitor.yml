name: Alerte Houx 24h du Mans

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: houx-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Surveiller la revente
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DURATION_MINUTES: "55"
          INTERVAL_SECONDS: "120"
        run: python monitor.py

      - name: Sauvegarder l'état (+ keepalive)
        if: always()
        run: |
          git config user.name "houx-bot"
          git config user.email "houx-bot@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Mise à jour de l'état"
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 2592000 ]; then
            git commit --allow-empty -m "keepalive"
          fi
          git push || true
